<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">


<form class="form" action="/login" method="post">
    <div class="form__field">
        <label class="form__label" for="username">Логин</label>
        <input class="form__input" type="text" id="username" name="username" placeholder="Введите логин" required>
    </div>

    <div class="form__field">
        <label class="form__label" for="password">Пароль</label>
        <input class="form__input form__input--error" type="password" id="password" name="password" required>
        <p class="form__hint form__hint--error">Неверный пароль</p>
    </div>

    <button class="form__submit" type="submit">Войти</button>

</form>
